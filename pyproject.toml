[project]
name = "nerlo"
# 0.4.0: the update notice (#11). A MINOR bump, not a patch, because `nerlo
# <command>` now writes a line it never wrote before — and not a MAJOR one,
# because the machine contract (`--json` `status`/`badge`/`summary`, the
# `--fail-on` tokens, the exit codes) is untouched: the notice goes to STDERR
# and is suppressed entirely under `--json`.
#
# EDITING THIS LINE PUBLISHES. #10 added `push: branches:[main],
# paths:["pyproject.toml"]` to `publish.yml`, so a bump reaching main ships
# itself to PyPI — no GitHub Release step, no second approval. The comment that
# used to sit here said the opposite ("Merging this does not ship it") and was
# written before that trigger existed; it is corrected rather than deleted so
# the next person to bump does not trust the old promise. A PyPI version can
# NEVER be reused, so a wrong number here is not recoverable by reverting.
#
# 0.3.0 was the badge vocabulary change: `Verified`/`Unsafe` became
# `Clean`/`Flagged` in printed output, machine contract byte-identical to 0.2.0.
version = "0.4.0"
description = "Nerlo CLI — search, inspect, and install MCP servers from the Nerlo security registry"
readme = "README.md"
requires-python = ">=3.11"
# Apache-2.0, settled 2026-08-11: it is what 0.1.0 already shipped under
# (pypi.org/pypi/nerlo/json reports license_expression "Apache-2.0"), the LICENSE
# file is the real 202-line Apache text, and GitHub detects it. Changing it now
# would only split the release history. The patent grant is also the right
# default for a security tool, which MIT does not provide.
license = "Apache-2.0"
authors = [{ name = "Nerlo" }]
keywords = ["mcp", "security", "registry", "cli", "nerlo"]
dependencies = [
    "click>=8.1",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://nerlo.ai"
Registry = "https://nerlo.ai/servers"

[project.scripts]
nerlo = "nerlo_cli.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nerlo_cli"]
