[project]
name = "nerlo"
# 0.3.0: the badge vocabulary change. A MINOR bump, not a patch, because the
# words every command prints are different — and not a MAJOR one, because the
# machine contract (`--json` `status`/`badge`/`summary`, the `--fail-on` tokens,
# the exit codes) is byte-identical to 0.2.0 by design. Merging this does not
# ship it: `publish.yml` fires on `release: published`, so a GitHub Release
# against this version is what reaches PyPI.
version = "0.3.0"
description = "Nerlo CLI — search, inspect, and install MCP servers from the Nerlo security registry"
readme = "README.md"
requires-python = ">=3.11"
# Apache-2.0, settled 2026-08-11: it is what 0.1.0 already shipped under
# (pypi.org/pypi/nerlo/json reports license_expression "Apache-2.0"), the LICENSE
# file is the real 202-line Apache text, and GitHub detects it. Changing it now
# would only split the release history. The patent grant is also the right
# default for a security tool, which MIT does not provide.
license = "Apache-2.0"
authors = [{ name = "Nerlo" }]
keywords = ["mcp", "security", "registry", "cli", "nerlo"]
dependencies = [
    "click>=8.1",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://nerlo.ai"
Registry = "https://nerlo.ai/servers"

[project.scripts]
nerlo = "nerlo_cli.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nerlo_cli"]
